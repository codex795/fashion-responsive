<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
  body {
    margin: 0;
    background: #020202;
    overflow: hidden;
    color: white;
    font-family: "Segoe UI", sans-serif;
  }
  canvas { display: block; }

  h1 {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 4em;
    color: #fff;
    text-shadow: 0 0 20px #ff00cc, 0 0 30px #00ccff;
  }

  /* right side circle image */
  .photo {
    position: absolute;
    top: 20%;
    right: 5%;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #00e6b8;
    box-shadow: 0 0 30px #00ffe1;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* image perfect circle me fit hogi */
  }

  /* days counter */
  .days {
    position: absolute;
    top: 60%;
    right: 8%;
    font-size: 24px;
    color: #00ffe1;
    background: rgba(255,255,255,0.1);
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid #00ffe1;
    box-shadow: 0 0 10px #00e6b8;
  }

  /* play button */
  .play-btn {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border: none;
    background: linear-gradient(90deg,#00ffe1,#ff00cc);
    color: white;
    font-size: 18px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px #00ffe1;
    transition: 0.3s;
  }
  .play-btn:hover {
    transform: translateX(-50%) scale(1.1);
  }
</style>
</head>
<body>
  <h1>🎉 Happy Birthday Mam! 🎂</h1>

  <div class="photo">
    <img src="mam.jpg" alt="Mam Photo"> <!-- ← apni photo ka naam yahan daalo -->
  </div>

  <div class="days">9131 Days of Awesomeness 😄</div>

  <button class="play-btn" onclick="toggleSong()">🎵 Play Song</button>

  <canvas id="birthday"></canvas>

  <audio id="song" src="birthday.mp3"></audio> <!-- ← apni song file ka naam yahan daalo -->

<script>
// 🎆 Fireworks code
const PI2 = Math.PI * 2;
const random = (min, max) => Math.random() * (max - min + 1) + min | 0;
const timestamp = _ => new Date().getTime();

class Birthday {
  constructor() {
    this.resize();
    this.fireworks = [];
    this.counter = 0;
  }
  
  resize() {
    this.width = canvas.width = window.innerWidth;
    let center = this.width / 2 | 0;
    this.spawnA = center - center / 4 | 0;
    this.spawnB = center + center / 4 | 0;
    this.height = canvas.height = window.innerHeight;
    this.spawnC = this.height * .1;
    this.spawnD = this.height * .5;
  }
  
  onClick(evt) {
     let x = evt.clientX || evt.touches && evt.touches[0].pageX;
     let y = evt.clientY || evt.touches && evt.touches[0].pageY;
     let count = random(3,5);
     for(let i = 0; i < count; i++) this.fireworks.push(new Firework(
        random(this.spawnA, this.spawnB),
        this.height,
        x,
        y,
        random(0, 260),
        random(30, 110)))
     this.counter = -1;
  }
  
  update(delta) {
    ctx.globalCompositeOperation = 'hard-light';
    ctx.fillStyle = `rgba(20,20,20,${ 7 * delta })`;
    ctx.fillRect(0, 0, this.width, this.height);

    ctx.globalCompositeOperation = 'lighter';
    for (let firework of this.fireworks) firework.update(delta);

    this.counter += delta * 3;
    if (this.counter >= 1) {
      this.fireworks.push(new Firework(
        random(this.spawnA, this.spawnB),
        this.height,
        random(0, this.width),
        random(this.spawnC, this.spawnD),
        random(0, 360),
        random(30, 110)))
      this.counter = 0;
    }
    if (this.fireworks.length > 1000) this.fireworks = this.fireworks.filter(firework => !firework.dead);
  }
}

class Firework {
  constructor(x, y, targetX, targetY, shade, offsprings) {
    this.dead = false;
    this.offsprings = offsprings;
    this.x = x;
    this.y = y;
    this.targetX = targetX;
    this.targetY = targetY;
    this.shade = shade;
    this.history = [];
  }
  update(delta) {
    if (this.dead) return;
    let xDiff = this.targetX - this.x;
    let yDiff = this.targetY - this.y;
    if (Math.abs(xDiff) > 3 || Math.abs(yDiff) > 3) {
      this.x += xDiff * 2 * delta;
      this.y += yDiff * 2 * delta;
      this.history.push({x: this.x, y: this.y});
      if (this.history.length > 20) this.history.shift();
    } else {
      if (this.offsprings && !this.madeChilds) {
        let babies = this.offsprings / 2;
        for (let i = 0; i < babies; i++) {
          let targetX = this.x + this.offsprings * Math.cos(PI2 * i / babies) | 0;
          let targetY = this.y + this.offsprings * Math.sin(PI2 * i / babies) | 0;
          birthday.fireworks.push(new Firework(this.x, this.y, targetX, targetY, this.shade, 0));
        }
      }
      this.madeChilds = true;
      this.history.shift();
    }
    if (this.history.length === 0) this.dead = true;
    else if (this.offsprings) { 
        for (let i = 0; this.history.length > i; i++) {
          let point = this.history[i];
          ctx.beginPath();
          ctx.fillStyle = 'hsl(' + this.shade + ',100%,' + i + '%)';
          ctx.arc(point.x, point.y, 1, 0, PI2, false);
          ctx.fill();
        } 
      } else {
      ctx.beginPath();
      ctx.fillStyle = 'hsl(' + this.shade + ',100%,50%)';
      ctx.arc(this.x, this.y, 1, 0, PI2, false);
      ctx.fill();
    }
  }
}

let canvas = document.getElementById('birthday');
let ctx = canvas.getContext('2d');
let then = timestamp();
let birthday = new Birthday();
window.onresize = () => birthday.resize();
document.onclick = evt => birthday.onClick(evt);
document.ontouchstart = evt => birthday.onClick(evt);

(function loop(){
  requestAnimationFrame(loop);
  let now = timestamp();
  let delta = now - then;
  then = now;
  birthday.update(delta / 1000);
})();

// 🎵 Play/Pause Button Function
function toggleSong() {
  let song = document.getElementById('song');
  let btn = document.querySelector('.play-btn');
  if (song.paused) {
    song.play();
    btn.textContent = "⏸️ Pause Song";
  } else {
    song.pause();
    btn.textContent = "🎵 Play Song";
  }
}
</script>
</body>
</html>
