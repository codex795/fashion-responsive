<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday</title>
  <style>
    :root{
      --bg:#0b0f1a;
      --accent:#00e676;
      --text:#e6f7ff;
    }
    html,body{height:100%;margin:0;font-family: 'Segoe UI', Roboto, sans-serif;}
    body{
      background:
       radial-gradient(ellipse at top left, rgba(0,230,118,0.06), transparent 20%),
       linear-gradient(180deg,#071022 0%, var(--bg) 100%);
      display:flex;align-items:center;justify-content:center;
      color:var(--text);
    }
    .card{
      width:900px; max-width:95%;
      background:linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid rgba(0,255,120,0.08);
      border-radius:16px; padding:36px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.7);
      text-align:center; position:relative; overflow:hidden;
    }
    h1{
      margin:0;font-size:48px; letter-spacing:1px;
      background:linear-gradient(90deg,var(--accent),#8affd6);
      -webkit-background-clip:text;
      background-clip: text;
      color:transparent;
      animation: pop 0.9s ease both;
    }
    @keyframes pop{
      from{transform:translateY(20px) scale(.95); opacity:0}
      to{transform:none; opacity:1}
    }
    p.lead{font-size:18px; color:rgba(230,247,255,0.9); margin-top:8px;}
    .cake{
      margin:26px auto 8px; width:220px; height:220px; position:relative;
      display:flex;align-items:center;justify-content:center;
    }
    /* simple cake rings */
    .cake .layer{width:160px;height:40px;border-radius:20px;background:#ffb3c6; margin:6px 0; box-shadow: inset 0 -6px 12px rgba(0,0,0,0.12);}
    .candle{position:absolute; top:18px; width:10px; height:40px; background:#ffd54f; border-radius:4px; left:50%; transform:translateX(-50%); box-shadow:0 2px 6px rgba(0,0,0,.2)}
    .flame{position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:12px; height:18px; background: radial-gradient(circle at 40% 30%, #fff2a8 0%, #ff9800 40%, #ff5722 80%); border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: flicker 1s infinite;}
    @keyframes flicker{
      0%{transform:translateX(-50%) scale(.95)}
      50%{transform:translateX(-50%) scale(1.05)}
      100%{transform:translateX(-50%) scale(.98)}
    }

    /* confetti dots (pure CSS) */
    .confetti{
      position:absolute; inset:0; pointer-events:none;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(0,230,118,0.9) 8%, transparent 9%),
        radial-gradient(circle at 30% 40%, rgba(0,183,255,0.9) 7%, transparent 8%),
        radial-gradient(circle at 70% 20%, rgba(255,64,129,0.9) 7%, transparent 8%),
        radial-gradient(circle at 85% 75%, rgba(176,255,0,0.9) 7%, transparent 8%),
        radial-gradient(circle at 45% 80%, rgba(255,214,10,0.9) 7%, transparent 8%);
      background-size: 100% 100%;
      animation: confmove 6s linear infinite;
      opacity:.95;
    }
    @keyframes confmove{
      0%{transform:translateY(-10%) rotate(0deg)}
      100%{transform:translateY(120%) rotate(720deg)}
    }

    .btn{
      margin-top:18px; display:inline-block; padding:10px 18px; border-radius:999px;
      border:1px solid rgba(0,255,120,0.12); background:transparent; color:var(--text); cursor:pointer;
      text-decoration:none; font-weight:600;
    }
    footer{margin-top:14px; font-size:13px; color:rgba(230,247,255,0.6)}
  </style>
</head>
<body>
  <div class="card">
    <div class="confetti" aria-hidden="true"></div>
    <h1>Happy Birthday, Mam!</h1>
    <p class="lead">Aaj aapka din bahut khaas ho — bahut saari khushiyan milein ✨</p>

    <div class="cake" aria-hidden="true">
      <div class="layer" style="transform:translateY(34px) scale(1.05)"></div>
      <div class="layer"></div>
      <div class="layer" style="width:140px;height:36px;background:#ff8aa6"></div>
      <div class="candle">
        <div class="flame"></div>
      </div>
    </div>
<a class="btn" href="#" onclick="document.querySelector('h1').textContent='🎉 Wish Sent!'; return false;">Wish karo</a>
    <footer>Designed with ❤️ — Save this file and open in browser</footer>
  </div>
</body>
</html>
