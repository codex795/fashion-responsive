<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday mam! 🎂</title>
  <style>
    @import url("https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap");

    *{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}

    body {
      margin: 0;
      background: #020202;
      cursor: crosshair;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      display: block;
    }

    h1 {
      position: relative;
      text-align: center;
      color: #fff;
      font-family: "Source Sans Pro", sans-serif;
      font-size: 4em;
      font-weight: 900;
      -webkit-user-select: none;
      user-select: none;
      text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
      animation: glow 2s ease-in-out infinite alternate;
      z-index: 2;
      margin-top: 20px;
      top: 31px;
    }

    @keyframes glow {
      from { text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff; }
      to { text-shadow: 0 0 40px #ffff00, 0 0 80px #ff0080; }
    }

    /* === Flip Card Section === */
    .wrapper {
      height: 400px;
      width: 320px;
      position: relative;
      transform-style: preserve-3d;
      perspective: 1000px;
      z-index: 2;
      margin: 100px auto;
    }

    .wrapper .card {
      position: absolute;
      height: 100%;
      width: 100%;
      padding: 5px;
      background: linear-gradient(385deg, purple, #0004ff);
      border-radius: 10px;
      transform: translateY(0deg);
      transform-style: preserve-3d;
      backface-visibility: hidden;
      box-shadow: 0 10px 15px rgba(0,0,0,.3);
      transition: transform .7s cubic-bezier(.4,.2,.2,1);
    }

    .wrapper:hover > .front-face { transform: rotateY(-180deg); }
    .wrapper:hover > .back-face { transform: rotateY(0deg); }

    .wrapper .card img {
      height: 100%;
      width: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    .wrapper .back-face {
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      flex-direction: column;
      transform: rotateY(180deg);
      background: linear-gradient(385deg, #7b00ff, #009dff);
      color: white;
    }

    .wrapper .back-face img {
      height: 150px;
      width: 150px;
      padding: 5px;
      border-radius: 50%;
      background: linear-gradient(375deg, #001aff, #0084ff);
      box-shadow: 0 0 5px #d3b3fc, 0 0 25px #f1edf7, 0 0 50px #f2f0f5;
    }

    .wrapper .back-face .info { text-align: center; }
    .back-face .info p { font-size: 17px; padding: 10px; color: #fff; }

    /* Button */
    button {
      display: block;
      cursor: pointer;
      font-weight: bold;
      font-size: 20px;
      margin: 0 auto;
      color: #23252f;
      padding: 15px 40px;
      border-radius: 9px;
      background: #64ed85;
      box-shadow: 3px 3px 6px #296137, -3px -3px 6px #9fffd3;
      transition: all .3s;
      z-index: 3;
      position: relative;
      top: 78px;
    }
    button:hover {
      transform: scale(1.05);
      background-position: 0 0, 0 0;
      transition-duration: .9s;
    }
    button:active {
      border-radius: 9px;
      background: #64ed85;
      box-shadow: inset 3px 3px 6px #296137, inset -3px -3px 6px #9fffd3;
    }
  </style>
</head>
<body>
  <canvas id="birthday"></canvas>

  <h1>Happy Birthday MAM! 🎉</h1>

  <button onclick="playMusic()">🎵 Play Birthday Song</button>

  <div class="wrapper">
    <div class="card front-face">
      <img src="https://i.gifer.com/origin/6a/6a5dc02cd17893a5ac3cb69f99035e78_w200.webp" alt="front">
    </div>

    <div class="card back-face">
      <img src= "logo/Screenshot_20250905-144807_WhatsApp-pica.png" alt="profile">
      <div class="info">
        <p>
          Wish U a very Happy and Happiest Birthday Mam! 🎂<br>
          May your life be filled with happiness, success, and all your wishes come true!<br>
          Enjoy your day! — From your coder ADII
        </p>
      </div>
    </div>
  </div>

  <audio id="song" src="https://jennierubyjanenini.github.io/Music-K-Files/happy%20birthday%20to%20you%20female%20voice%20wishes.mp3"></audio>

  <script>
    function playMusic() {
      const song = document.getElementById("song");
      song.play().catch(e => console.warn("Playback prevented:", e));
    }

    // fireworks JS
    const PI2 = Math.PI * 2;
    const random = (min, max) => Math.random() * (max - min + 1) + min | 0;
    const timestamp = _ => new Date().getTime();

    class Birthday {
      constructor() {
        this.resize();
        this.fireworks = [];
        this.counter = 0;
      }
      resize() {
        this.width = canvas.width = window.innerWidth;
        let center = this.width / 2 | 0;
        this.spawnA = center - center / 4 | 0;
        this.spawnB = center + center / 4 | 0;
        this.height = canvas.height = window.innerHeight;
        this.spawnC = this.height * .1;
        this.spawnD = this.height * .5;
      }
      onClick(evt) {
        let x = evt.clientX || evt.touches && evt.touches[0].pageX;
        let y = evt.clientY || evt.touches && evt.touches[0].pageY;
        let count = random(3, 5);
        for (let i = 0; i < count; i++) {
          this.fireworks.push(new Firework(
            random(this.spawnA, this.spawnB),
            this.height,
            x,
            y,
            random(0, 260),
            random(30, 110)
          ));
        }
        this.counter = -1;
      }
      update(delta) {
        ctx.globalCompositeOperation = 'hard-light';
        ctx.fillStyle = `rgba(20,20,20,${7 * delta})`;
        ctx.fillRect(0, 0, this.width, this.height);
        ctx.globalCompositeOperation = 'lighter';
        for (let firework of this.fireworks) firework.update(delta);
        this.counter += delta * 3;
        if (this.counter >= 1) {
          this.fireworks.push(new Firework(
            random(this.spawnA, this.spawnB),
            this.height,
            random(0, this.width),
            random(this.spawnC, this.spawnD),
            random(0, 360),
            random(30, 110)
          ));
          this.counter = 0;
        }
        if (this.fireworks.length > 1000)
          this.fireworks = this.fireworks.filter(f => !f.dead);
      }
    }

    class Firework {
      constructor(x, y, targetX, targetY, shade, offsprings) {
        this.dead = false;
        this.offsprings = offsprings;
        this.x = x;
        this.y = y;
        this.targetX = targetX;
        this.targetY = targetY;
        this.shade = shade;
        this.history = [];
      }
      update(delta) {
        if (this.dead) return;
        let xDiff = this.targetX - this.x;
        let yDiff = this.targetY - this.y;
        if (Math.abs(xDiff) > 3 || Math.abs(yDiff) > 3) {
          this.x += xDiff * 2 * delta;
          this.y += yDiff * 2 * delta;
          this.history.push({ x: this.x, y: this.y });
          if (this.history.length > 20) this.history.shift();
        } else {
          if (this.offsprings && !this.madeChilds) {
            let babies = this.offsprings / 2;
            for (let i = 0; i < babies; i++) {
              let targetX = this.x + this.offsprings * Math.cos(PI2 * i / babies) | 0;
              let targetY = this.y + this.offsprings * Math.sin(PI2 * i / babies) | 0;
              birthday.fireworks.push(new Firework(this.x, this.y, targetX, targetY, this.shade, 0));
            }
          }
          this.madeChilds = true;
          this.history.shift();
        }
        if (this.history.length === 0) this.dead = true;
        else if (this.offsprings) {
          for (let i = 0; i < this.history.length; i++) {
            let point = this.history[i];
            ctx.beginPath();
            ctx.fillStyle = 'hsl(' + this.shade + ',100%,' + i + '%)';
            ctx.arc(point.x, point.y, 1, 0, PI2, false);
            ctx.fill();
          }
        } else {
          ctx.beginPath();
          ctx.fillStyle = 'hsl(' + this.shade + ',100%,50%)';
          ctx.arc(this.x, this.y, 1, 0, PI2, false);
          ctx.fill();
        }
      }
    }

    let canvas = document.getElementById('birthday');
    let ctx = canvas.getContext('2d');
    let then = timestamp();
    let birthday = new Birthday();

    window.onresize = () => birthday.resize();
    document.onclick = evt => birthday.onClick(evt);
    document.ontouchstart = evt => birthday.onClick(evt);

    (function loop() {
      requestAnimationFrame(loop);
      let now = timestamp();
      let delta = now - then;
      then = now;
      birthday.update(delta / 1000);
    })();
  </script>
</body>
</html>
